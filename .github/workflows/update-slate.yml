name: Update slate.json (hourly)

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build slate.json
        run: node build.js

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain slate.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add slate.json
            git commit -m "chore: update slate.json [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
